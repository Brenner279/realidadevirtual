name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
      - '*.png'
      - '*.mp3'
      - '*.mp4'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Montar experiência A-Frame VR para uso offline
        run: |
          mkdir -p www/vendor www/assets
          cp index.html style.css www/
          cp ./*.png ./*.mp3 ./*.mp4 www/
          cp -R assets/. www/assets/

          # A-Frame e o fallback Cardboard ficam dentro do APK; não há CDN em tempo de execução.
          curl -fL --retry 3 https://aframe.io/releases/1.8.0/aframe.min.js -o www/vendor/aframe.min.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/webxr-polyfill@2.0.3/build/webxr-polyfill.min.js -o www/vendor/webxr-polyfill.min.js
          test -s www/vendor/aframe.min.js
          test -s www/vendor/webxr-polyfill.min.js

          python3 - <<'PY'
          from pathlib import Path

          page = Path("www/index.html")
          html = page.read_text(encoding="utf-8")
          # O APK usa controles próprios acionados por gaze, pois o Cardboard UI
          # legado depende de toque direto, que não é entregue de forma consistente no WebView.
          if "window.BRASIL_IMERSIVO_APK = true;" not in html:
              html = html.replace("<head>", "<head>\n  <script>window.BRASIL_IMERSIVO_APK = true;</script>", 1)

          polyfill_cdn = "https://cdn.jsdelivr.net/npm/webxr-polyfill@2.0.3/build/webxr-polyfill.min.js"
          if polyfill_cdn not in html:
              raise SystemExit("A referência ao WebXR Polyfill 2.0.3 não foi encontrada.")
          html = html.replace(polyfill_cdn, "vendor/webxr-polyfill.min.js")

          aframe_cdn = "https://aframe.io/releases/1.8.0/aframe.min.js"
          if aframe_cdn not in html:
              raise SystemExit("A referência ao A-Frame 1.8.0 não foi encontrada.")
          html = html.replace(aframe_cdn, "vendor/aframe.min.js")

          # O fallback Cardboard usa parâmetros internos, sem consultar a base remota de aparelhos.
          old_init = "window.webxrPolyfill = new WebXRPolyfill({ cardboard: true });"
          new_init = """window.webxrPolyfill = new WebXRPolyfill({
              cardboard: true,
              cardboardConfig: {
                DPDB_URL: null,
                DEFAULT_VIEWER: "CardboardV1",
                MOBILE_WAKE_LOCK: true,
                CARDBOARD_UI_DISABLED: true,
                ROTATE_INSTRUCTIONS_DISABLED: false,
                BUFFER_SCALE: 0.5
              }
            });"""
          if old_init not in html:
              raise SystemExit("A inicialização padrão do WebXR Polyfill não foi encontrada.")
          html = html.replace(old_init, new_init)

          # Fontes externas são opcionais; removê-las mantém a experiência sem rede.
          html = "\n".join(
              line for line in html.splitlines()
              if "fonts.googleapis.com" not in line and "fonts.gstatic.com" not in line
          ) + "\n"

          required = [
              "vendor/aframe.min.js",
              "vendor/webxr-polyfill.min.js",
              "new WebXRPolyfill(",
              "cardboard: true",
              "DPDB_URL: null",
              "CARDBOARD_UI_DISABLED: true",
              "window.BRASIL_IMERSIVO_APK = true;",
              'vr-mode-ui="enabled: true"',
          ]
          for token in required:
              if token not in html:
                  raise SystemExit(f"Configuração VR offline ausente: {token}")

          if "https://cdn.jsdelivr.net/npm/webxr-polyfill" in html:
              raise SystemExit("O APK ainda tenta carregar o WebXR Polyfill pela internet.")
          if "https://aframe.io/releases/" in html:
              raise SystemExit("O APK ainda tenta carregar A-Frame pela internet.")

          page.write_text(html, encoding="utf-8")
          PY

          echo "Verificando arquivos locais obrigatórios:"
          test -s www/vendor/aframe.min.js
          test -s www/vendor/webxr-polyfill.min.js
          test -s www/assets/mapa.png
          test -s www/assets/biomas/amazonia/fauna-flora.jpg
          test -s www/assets/biomas/amazonia/fauna-vr.mp4
          test -s www/Mata.png

          if grep -E 'https?://' www/index.html | grep -v 'http-equiv'; then
            echo 'Foram encontradas referências HTTP externas no HTML do aplicativo.'
            exit 1
          fi
          echo "Arquivos locais preparados:"
          du -sh www

      - name: Criar projeto Android
        run: npx cap add android

      - name: Registrar botão nativo VOLTAR no Android
        run: |
          JAVA_DIR=android/app/src/main/java/com/michelbrenner/brasilimersivo
          mkdir -p "$JAVA_DIR"

          cat > "$JAVA_DIR/VrBackButtonPlugin.java" <<'JAVA'
          package com.michelbrenner.brasilimersivo;

          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.FrameLayout;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "VrBackButton")
          public class VrBackButtonPlugin extends Plugin {
              private Button backButton;

              private int dp(float value) {
                  return Math.round(value * getContext().getResources().getDisplayMetrics().density);
              }

              @PluginMethod
              public void show(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      FrameLayout root = getActivity().findViewById(android.R.id.content);
                      if (root == null) {
                          call.reject("Não foi possível localizar a tela do aplicativo.");
                          return;
                      }

                      if (backButton == null || backButton.getParent() != root) {
                          Button button = new Button(getActivity());
                          button.setText("← Voltar");
                          button.setTextColor(Color.WHITE);
                          button.setTextSize(14);
                          button.setAllCaps(false);
                          button.setGravity(Gravity.CENTER);
                          button.setPadding(dp(10), 0, dp(10), 0);
                          button.setMinimumWidth(dp(78));
                          button.setMinWidth(dp(78));
                          button.setMinHeight(dp(42));

                          GradientDrawable background = new GradientDrawable();
                          background.setColor(0xE6174A35);
                          background.setCornerRadius(dp(10));
                          button.setBackground(background);
                          button.setElevation(dp(10));
                          button.setContentDescription("Voltar e sair do modo VR");
                          button.setClickable(true);
                          button.setFocusable(true);
                          button.setOnClickListener(view ->
                              getBridge().eval(
                                  "if (window.__brasilImersivoExitVR) { window.__brasilImersivoExitVR(); }",
                                  null
                              )
                          );

                          FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.WRAP_CONTENT,
                              dp(42),
                              Gravity.TOP | Gravity.START
                          );
                          params.setMargins(dp(8), dp(2), 0, 0);
                          root.addView(button, params);
                          backButton = button;
                      }

                      backButton.setVisibility(View.VISIBLE);
                      backButton.bringToFront();
                      call.resolve();
                  });
              }

              @PluginMethod
              public void hide(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      if (backButton != null) {
                          backButton.setVisibility(View.GONE);
                      }
                      call.resolve();
                  });
              }
          }
          JAVA

          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package com.michelbrenner.brasilimersivo;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(VrBackButtonPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Sincronizar aplicação
        run: npx cap sync android

      - name: Compilar APK de depuração
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Brasil-Imersivo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
