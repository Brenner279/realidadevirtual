name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
      - '*.png'
      - '*.mp3'
      - '*.mp4'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Montar arquivos locais para uso offline
        run: |
          mkdir -p www/vendor www/assets
          cp index.html style.css www/
          cp ./*.png ./*.mp3 ./*.mp4 www/
          cp -R assets/. www/assets/

          curl -fL --retry 3 https://aframe.io/releases/1.8.0/aframe.min.js -o www/vendor/aframe.min.js
          test -s www/vendor/aframe.min.js
          sed -i \
            -e 's#https://aframe.io/releases/1.8.0/aframe.min.js#vendor/aframe.min.js#g' \
            -e '/fonts.googleapis.com/d' \
            -e '/fonts.gstatic.com/d' \
            www/index.html
          echo "Verificando arquivos offline obrigatórios:"
          test -s www/vendor/aframe.min.js
          test -s www/assets/mapa.png
          test -s www/assets/biomas/amazonia/fauna-flora.jpg
          test -s www/assets/biomas/amazonia/fauna-vr.mp4
          test -s www/Mata.png
          if grep -E 'https?://' www/index.html | grep -v 'http-equiv'; then
            echo 'Foram encontradas referências HTTP externas no aplicativo.'
            exit 1
          fi
          echo "Arquivos locais preparados:"
          du -sh www

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar Android para óculos VR sem controle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          pattern = r'(<activity\b[^>]*android:name="\.MainActivity"[^>]*)(>)'
          source, count = re.subn(pattern, r'\1 android:screenOrientation="landscape"\2', source, count=1)
          if count != 1:
              raise SystemExit("Não foi possível configurar a orientação paisagem da MainActivity.")
          manifest.write_text(source)

          java_files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if not java_files:
              raise SystemExit("MainActivity.java não foi encontrado.")
          main = java_files[0]
          source = main.read_text()
          package = re.search(r'^package\s+[^;]+;', source, re.M)
          if not package:
              raise SystemExit("Declaração de pacote Android não encontrada.")
          source = package.group(0) + """

          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }
              }
          }
          """
          main.write_text(source)
          print("Android configurado em paisagem e tela imersiva.")
          PY

      - name: Sincronizar aplicação
        run: npx cap sync android

      - name: Compilar APK de depuração
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Brasil-Imersivo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
