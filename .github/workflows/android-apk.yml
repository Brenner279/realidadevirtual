name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
      - '*.png'
      - '*.mp3'
      - '*.mp4'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Montar arquivos locais para uso offline
        run: |
          mkdir -p www/vendor www/assets
          cp index.html style.css www/
          cp ./*.png ./*.mp3 ./*.mp4 www/
          cp -R assets/. www/assets/

          cp node_modules/webxr-polyfill/build/webxr-polyfill.min.js www/vendor/webxr-polyfill.min.js
          test -s www/vendor/webxr-polyfill.min.js

          curl -fL --retry 3 https://aframe.io/releases/1.8.0/aframe.min.js -o www/vendor/aframe.min.js
          test -s www/vendor/aframe.min.js
          test -s www/vendor/webxr-polyfill.min.js
          sed -i \
            -e 's#https://cdn.jsdelivr.net/npm/webxr-polyfill@2.0.3/build/webxr-polyfill.min.js#vendor/webxr-polyfill.min.js#g' \
            -e 's#https://aframe.io/releases/1.8.0/aframe.min.js#vendor/aframe.min.js#g' \
            -e '/fonts.googleapis.com/d' \
            -e '/fonts.gstatic.com/d' \
            www/index.html
          echo "Verificando arquivos offline obrigatórios:"
          test -s www/vendor/aframe.min.js
          test -s www/assets/mapa.png
          test -s www/assets/biomas/amazonia/fauna-flora.jpg
          test -s www/assets/biomas/amazonia/fauna-vr.mp4
          test -s www/Mata.png
          if grep -E 'https?://' www/index.html | grep -v 'http-equiv'; then
            echo 'Foram encontradas referências HTTP externas no aplicativo.'
            exit 1
          fi
          echo "Arquivos locais preparados:"
          du -sh www

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicação
        run: npx cap sync android

      - name: Compilar APK de depuração
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Brasil-Imersivo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
