name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
      - '*.png'
      - '*.mp3'
      - '*.mp4'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Montar arquivos locais para uso offline
        run: |
          mkdir -p www/vendor www/assets
          cp index.html style.css www/
          cp ./*.png ./*.mp3 ./*.mp4 www/
          cp -R assets/. www/assets/

          curl -fL --retry 3 https://aframe.io/releases/1.8.0/aframe.min.js -o www/vendor/aframe.min.js
          test -s www/vendor/aframe.min.js
          test -s www/vendor/capacitor.js
          # O HTML é clássico (sem bundler): inclui explicitamente o runtime JS do Capacitor.
          cp node_modules/@capacitor/core/dist/capacitor.js www/vendor/capacitor.js
          test -s www/vendor/capacitor.js

          # O APK não usa WebXR Polyfill/Cardboard: o botão VR chama o plugin Android nativo.
          python3 - <<'PY'
          from pathlib import Path

          page = Path("www/index.html")
          html = page.read_text(encoding="utf-8")
          polyfill_tag = '<script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@2.0.3/build/webxr-polyfill.min.js"></script>'
          start = html.find(polyfill_tag)
          if start < 0:
              raise SystemExit("Tag do WebXR Polyfill não encontrada.")
          init_start = html.find("window.webxrPolyfill", start)
          if init_start < 0:
              raise SystemExit("Inicialização do WebXR Polyfill não encontrada.")
          end = html.find("</script>", init_start)
          if end < 0:
              raise SystemExit("Fechamento da inicialização do WebXR Polyfill não encontrado.")
          html = html[:start] + html[end + len("</script>"):]
          html = html.replace('vr-mode-ui="enabled: true"', 'vr-mode-ui="enabled: false"')
          html = html.replace(
              'https://aframe.io/releases/1.8.0/aframe.min.js',
              'vendor/aframe.min.js'
          )
          # Carrega o runtime Capacitor antes do JavaScript do projeto.
          if 'vendor/capacitor.js' not in html:
              html = html.replace('<head>', '<head>\n  <script src="vendor/capacitor.js"></script>', 1)
          if 'vendor/capacitor.js' not in html:
              raise SystemExit('Runtime do Capacitor não foi incluído no index.html do APK.')
          html = "\n".join(
              line for line in html.splitlines()
              if "fonts.googleapis.com" not in line and "fonts.gstatic.com" not in line
          ) + "\n"
          if any(token in html for token in (
              "webxr-polyfill", "WebXRPolyfill", "cardboard: true"
          )):
              raise SystemExit("O APK ainda contém referência ao Cardboard/WebXR Polyfill.")
          page.write_text(html, encoding="utf-8")
          PY
          echo "Verificando arquivos offline obrigatórios:"
          test -s www/vendor/aframe.min.js
          test -s www/assets/mapa.png
          test -s www/assets/biomas/amazonia/fauna-flora.jpg
          test -s www/assets/biomas/amazonia/fauna-vr.mp4
          test -s www/Mata.png
          if grep -E 'https?://' www/index.html | grep -v 'http-equiv'; then
            echo 'Foram encontradas referências HTTP externas no aplicativo.'
            exit 1
          fi
          echo "Arquivos locais preparados:"
          du -sh www

      - name: Criar projeto Android
        run: npx cap add android

      - name: Registrar modo imersivo nativo
        run: bash scripts/prepare-android-native.sh

      - name: Sincronizar aplicação
        run: npx cap sync android

      - name: Compilar APK de depuração
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Brasil-Imersivo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
